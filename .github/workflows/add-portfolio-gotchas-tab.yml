name: Patch portfolio navigation

on:
  push:
    paths:
      - 'tools/patch_portfolio_gotchas.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch portfolio
        run: python tools/patch_portfolio_gotchas.py
      - name: Commit portfolio change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html parts/gotchas.js parts/index.html
          git commit -m "Expose Why I got annoyed tab from portfolio"
          git push
