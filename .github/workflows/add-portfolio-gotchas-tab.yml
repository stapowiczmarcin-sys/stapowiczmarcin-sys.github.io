name: Add portfolio gotchas tab

on:
  push:
    paths:
      - '.github/workflows/add-portfolio-gotchas-tab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add separate gotchas tab to portfolio
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css_anchor = '    .button-primary:hover { background: #ffad67; }'
          css_insert = '''    .button-primary:hover { background: #ffad67; }
    .button-gotchas {
      border-color: rgba(255,92,92,.72);
      color: #fff;
      background: rgba(255,50,50,.14);
      font-weight: 900;
      white-space: nowrap;
    }
    .button-gotchas:hover { border-color: #ff5c5c; background: rgba(255,50,50,.24); }
'''
          if '.button-gotchas {' not in text:
              if css_anchor not in text:
                  raise SystemExit('CSS anchor not found')
              text = text.replace(css_anchor, css_insert, 1)

          top_anchor = '        <a class="button" href="https://stapowiczmarcin-sys.github.io/parts/#catalog" target="_blank" rel="noopener" data-pl="Katalog części" data-en="Parts catalogue">Katalog części</a>'
          top_new = top_anchor + '\n        <a class="button button-gotchas" href="https://stapowiczmarcin-sys.github.io/parts/#gotchas" target="_blank" rel="noopener" data-pl="🤬 DLACZEGO SIĘ WKURZYŁEM" data-en="🤬 WHY I GOT ANNOYED">🤬 DLACZEGO SIĘ WKURZYŁEM</a>'
          if 'data-pl="🤬 DLACZEGO SIĘ WKURZYŁEM"' not in text:
              if top_anchor not in text:
                  raise SystemExit('Top navigation anchor not found')
              text = text.replace(top_anchor, top_new, 1)

          hero_anchor = '            <a class="button" href="https://stapowiczmarcin-sys.github.io/parts/#catalog" target="_blank" rel="noopener" data-pl="Katalog użytych części" data-en="Parts used in my projects">Katalog użytych części</a>'
          hero_new = hero_anchor + '\n            <a class="button button-gotchas" href="https://stapowiczmarcin-sys.github.io/parts/#gotchas" target="_blank" rel="noopener" data-pl="🤬 DLACZEGO SIĘ WKURZYŁEM" data-en="🤬 WHY I GOT ANNOYED">🤬 DLACZEGO SIĘ WKURZYŁEM</a>'
          if text.count('href="https://stapowiczmarcin-sys.github.io/parts/#gotchas"') < 2:
              if hero_anchor not in text:
                  raise SystemExit('Hero catalogue anchor not found')
              text = text.replace(hero_anchor, hero_new, 1)

          mobile_anchor = '      .button-youtube { gap: 7px; padding-inline: 11px; }'
          mobile_new = mobile_anchor + '\n      .top-actions .button-gotchas { padding-inline: 10px; font-size: .7rem; }'
          if '.top-actions .button-gotchas' not in text:
              if mobile_anchor not in text:
                  raise SystemExit('Mobile CSS anchor not found')
              text = text.replace(mobile_anchor, mobile_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit change
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Portfolio already contains the tab."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Why I got annoyed tab to portfolio"
          git push
