name: Publish tested Kora eyes v2

on:
  push:
    paths:
      - '.github/eye-patches/TRIGGER2'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact hardware-tested sources
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/eye-patches/final-tested.patch.b64 | bzip2 -dc > /tmp/final-tested.patch
          patch -p1 --batch --forward < /tmp/final-tested.patch || true

          python3 - <<'PY'
          from pathlib import Path
          import base64, re

          human_light = base64.b64decode('')
          metal_light = base64.b64decode('')
          draw = base64.b64decode('ICBmbG9hdCBzcUwgPSAocXVpZXRNb2RlIHx8IGNydFN0YXRlID09IDIpID8gMC4wZiA6IGxpZ2h0U3F1aW50TDsKICBmbG9hdCBzcVIgPSAocXVpZXRNb2RlIHx8IGNydFN0YXRlID09IDIpID8gMC4wZiA6IGxpZ2h0U3F1aW50UjsKCiAgb0wgKj0gKDEuMGYgLSAwLjgwZiAqIHNxTCk7CiAgb1IgKj0gKDEuMGYgLSAwLjgwZiAqIHNxUik7CgoK')
          serial = base64.b64decode('')

          targets = {
              Path('eyes/KoraHumanMetalV18_S3_PUBLIC/KoraHumanMetalV18_S3_PUBLIC.ino'): human_light,
              Path('eyes/KoraMetalEyesV18_S3_PUBLIC/KoraMetalEyesV18_S3_PUBLIC.ino'): metal_light,
              Path('eyes/KoraMonsterEyesV18_S3_PUBLIC/KoraMonsterEyesV18_S3_PUBLIC.ino'): metal_light,
          }

          patterns = [
              re.compile(rb'(?ms)^// Ambient-light sensors:.*?(?=^static bool handleIrisPupil)'),
              re.compile(rb'(?ms)^  float sqL = .*?(?=^  oL \*= displayPower\.lid;)'),
              re.compile(rb'(?ms)^  if \(upper == "LIST"\) \{ printBehaviorList\(\); return; \}\n.*?^  triggerEarPerk\(\);\n'),
          ]

          for path, light in targets.items():
              data = path.read_bytes()
              for pat, replacement, label in zip(patterns, [light, draw, serial], ['light', 'draw', 'serial']):
                  data, n = pat.subn(lambda _m, r=replacement: r, data, count=1)
                  if n != 1:
                      raise SystemExit(f'{path}: expected one {label} region, found {n}')
              path.write_bytes(data)

          for rej in Path('eyes').rglob('*.rej'):
              rej.unlink()
          PY

      - name: Verify exact tested source hashes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/eyes.sha256 <<'EOF'
          cf620a04d0c655c9a1d82bb14203252fcefd16a2fec45b9f592d710ece6af030  eyes/KoraHumanMetalV18_S3_PUBLIC/KoraHumanMetalV18_S3_PUBLIC.ino
          fadeefb0f9acaedcb9a58d17b743165260b37021eaf3d9487a094c01ae051853  eyes/KoraMetalEyesV18_S3_PUBLIC/KoraMetalEyesV18_S3_PUBLIC.ino
          c469400b230b5cb2bab4897ae1bd711c498ec3ec750dcf95a2a1bb68721f4c88  eyes/KoraMonsterEyesV18_S3_PUBLIC/KoraMonsterEyesV18_S3_PUBLIC.ino
          109b7e376f34329aa5831ba43a451932e6f49efee88af0572480ee39e2c58133  eyes/KoraAnimalEyesV14_S3_PUBLIC/KoraAnimalEyesV14_S3_PUBLIC.ino
          EOF
          sha256sum -c /tmp/eyes.sha256

      - name: Rebuild download ZIPs and V18 manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, re, shutil, zipfile

          pairs = {
              Path('eyes/KoraHumanMetalV18_S3_PUBLIC.zip'): Path('eyes/KoraHumanMetalV18_S3_PUBLIC/KoraHumanMetalV18_S3_PUBLIC.ino'),
              Path('eyes/KoraMetalEyesV18_S3_PUBLIC.zip'): Path('eyes/KoraMetalEyesV18_S3_PUBLIC/KoraMetalEyesV18_S3_PUBLIC.ino'),
              Path('eyes/KoraMonsterEyesV18_S3_PUBLIC.zip'): Path('eyes/KoraMonsterEyesV18_S3_PUBLIC/KoraMonsterEyesV18_S3_PUBLIC.ino'),
              Path('eyes/KoraAnimalEyesV14_S3_PUBLIC.zip'): Path('eyes/KoraAnimalEyesV14_S3_PUBLIC/KoraAnimalEyesV14_S3_PUBLIC.ino'),
          }

          for zpath, ino in pairs.items():
              tmp = zpath.with_suffix(zpath.suffix + '.tmp')
              replaced = 0
              with zipfile.ZipFile(zpath, 'r') as src, zipfile.ZipFile(tmp, 'w') as dst:
                  for info in src.infolist():
                      data = src.read(info.filename)
                      if PurePosixPath(info.filename).name == ino.name:
                          data = ino.read_bytes()
                          replaced += 1
                      dst.writestr(info, data)
              if replaced != 1:
                  tmp.unlink(missing_ok=True)
                  raise SystemExit(f'{zpath}: expected exactly one {ino.name}, found {replaced}')
              shutil.move(tmp, zpath)
              with zipfile.ZipFile(zpath, 'r') as check:
                  bad = check.testzip()
                  if bad:
                      raise SystemExit(f'{zpath}: CRC failure in {bad}')
              print('ZIP OK', zpath, hashlib.sha256(zpath.read_bytes()).hexdigest())

          manifest = Path('eyes/SHA256_V18.json')
          text = manifest.read_text(encoding='utf-8')
          for zpath in list(pairs)[:3]:
              digest = hashlib.sha256(zpath.read_bytes()).hexdigest()
              pat = rf'("{re.escape(zpath.name)}"\s*:\s*")[0-9a-f]{{64}}(")'
              text, n = re.subn(pat, rf'\g<1>{digest}\g<2>', text, count=1)
              if n != 1:
                  raise SystemExit(f'manifest entry not found: {zpath.name}')
          manifest.write_text(text, encoding='utf-8')
          PY

      - name: Commit tested builds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            eyes/KoraHumanMetalV18_S3_PUBLIC/KoraHumanMetalV18_S3_PUBLIC.ino \
            eyes/KoraMetalEyesV18_S3_PUBLIC/KoraMetalEyesV18_S3_PUBLIC.ino \
            eyes/KoraMonsterEyesV18_S3_PUBLIC/KoraMonsterEyesV18_S3_PUBLIC.ino \
            eyes/KoraAnimalEyesV14_S3_PUBLIC/KoraAnimalEyesV14_S3_PUBLIC.ino \
            eyes/KoraHumanMetalV18_S3_PUBLIC.zip \
            eyes/KoraMetalEyesV18_S3_PUBLIC.zip \
            eyes/KoraMonsterEyesV18_S3_PUBLIC.zip \
            eyes/KoraAnimalEyesV14_S3_PUBLIC.zip \
            eyes/SHA256_V18.json
          git diff --cached --quiet && { echo 'No changes to publish'; exit 0; }
          git commit -m 'Publish four hardware-tested Kora eye builds (LIGHT5S)'
          git push
