name: Patch Kora six-leg servo test note

on:
  push:
    paths:
      - 'tools/patch_kora_six_leg_short.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch portfolio
        run: python tools/patch_kora_six_leg_short.py
      - name: Commit portfolio change
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Kora six-leg servo test Short to portfolio"
          git push
