name: Kora Animal pupil audit once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kora-animal-pupil-audit-once.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit Animal pupil/render structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('eyes/KoraAnimalEyesV14_S3_PUBLIC/KoraAnimalEyesV14_S3_PUBLIC.ino')
          lines=p.read_text(encoding='utf-8',errors='replace').splitlines()
          needles=('pupil','iris','renderEye','drawEye','eyePair','LOOK','gaze','lookX','lookY','PIN_','setup()','loop()')
          hits=[]
          for i,line in enumerate(lines,1):
            lo=line.lower()
            if ('pupil' in lo or 'iris' in lo or 'rendereye' in lo or 'draweye' in lo or
                'eyepair' in lo or 'gaze' in lo or 'lookx' in lo or 'looky' in lo or
                'static constexpr int pin_' in lo or line.startswith('void setup') or line.startswith('void loop')):
              hits.append(i)
          print('TOTAL HITS',len(hits))
          for i in hits[:500]:
            print(f'{i}: {lines[i-1][:260]}')
          # focused contexts around first pupil-related hits in lower half of generated assets
          pupil_hits=[i for i,l in enumerate(lines,1) if 'pupil' in l.lower()]
          print('PUPIL HIT COUNT',len(pupil_hits))
          for center in pupil_hits[-40:]:
            a=max(1,center-2); b=min(len(lines),center+2)
            print(f'--- context {a}-{b} ---')
            for j in range(a,b+1): print(f'{j}: {lines[j-1][:260]}')
          PY
      - name: Remove audit workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/kora-animal-pupil-audit-once.yml
          git commit -m "Remove temporary Animal pupil audit workflow"
          git push
