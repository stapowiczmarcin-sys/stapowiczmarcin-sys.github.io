name: Export current Kora eyes

on:
  push:
    paths:
      - '.github/eye-patches/EXPORT_TRIGGER'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Collect current public sketches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/current-eyes
          cp eyes/KoraHumanMetalV18_S3_PUBLIC/KoraHumanMetalV18_S3_PUBLIC.ino /tmp/current-eyes/
          cp eyes/KoraMetalEyesV18_S3_PUBLIC/KoraMetalEyesV18_S3_PUBLIC.ino /tmp/current-eyes/
          cp eyes/KoraMonsterEyesV18_S3_PUBLIC/KoraMonsterEyesV18_S3_PUBLIC.ino /tmp/current-eyes/
          cp eyes/KoraAnimalEyesV14_S3_PUBLIC/KoraAnimalEyesV14_S3_PUBLIC.ino /tmp/current-eyes/
          sha256sum /tmp/current-eyes/*.ino
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: current-eyes
          path: /tmp/current-eyes
          if-no-files-found: error
          retention-days: 1
