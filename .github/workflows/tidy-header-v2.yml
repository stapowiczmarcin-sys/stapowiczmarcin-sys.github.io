name: Tidy header v2
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch header
        shell: bash
        run: |
          echo '  ' | tr -d ' ' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          git config user.name Morrcin
          git config user.email stapowiczmarcin@gmail.com
          git add index.html
          git commit -m 'Tidy portfolio header navigation' || true
          git rm -f .github/workflows/tidy-header-v2.yml .github/workflows/tidy-portfolio-header.yml
          git commit -m 'Remove temporary header workflows'
          git push
