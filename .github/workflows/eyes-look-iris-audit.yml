name: Audit LOOK and IRIS integration
on:
  push:
    branches: [tmp/eyes-bright-squint-audit-2026-09-29]
    paths: ['.github/workflows/eyes-look-iris-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect gaze override context
        shell: bash
        run: |
          set -euo pipefail
          files=(
            eyes/KoraHumanMetalV18_S3_PUBLIC/KoraHumanMetalV18_S3_PUBLIC.ino
            eyes/KoraMetalEyesV18_S3_PUBLIC/KoraMetalEyesV18_S3_PUBLIC.ino
            eyes/KoraMonsterEyesV18_S3_PUBLIC/KoraMonsterEyesV18_S3_PUBLIC.ino
          )
          for f in "${files[@]}"; do
            echo "===== $f ====="
            echo '--- IRIS parser ---'
            n=$(grep -n 'static bool handleIrisPupil' "$f" | cut -d: -f1)
            sed -n "$n,$((n+28))p" "$f"
            echo '--- automatic gaze context ---'
            n=$(grep -n 'faceTarget.lookX = clampF(faceTarget.lookX +' "$f" | cut -d: -f1)
            sed -n "$((n-45)),$((n+65))p" "$f"
            echo '--- serial parser entry ---'
            n=$(grep -n 'static void handleSerialLine' "$f" | cut -d: -f1)
            sed -n "$n,$((n+55))p" "$f"
          done
