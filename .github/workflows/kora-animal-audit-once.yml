name: Kora Animal light squint finalizer once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kora-animal-audit-once.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate Animal eye source
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/kora_animal_audit_once.py
          git diff --check
          echo '--- ANIMAL SOURCE NUMSTAT ---'
          git diff --numstat -- eyes/KoraAnimalEyesV14_S3_PUBLIC/KoraAnimalEyesV14_S3_PUBLIC.ino | tee /tmp/animal-numstat.txt
          awk -F '\t' '($1=="-" || $2=="-"){exit 10} (($1+$2)>140){exit 11} END{if(NR!=1)exit 12}' /tmp/animal-numstat.txt
          echo '--- STATUS ---'
          git status --short
      - name: Commit Animal source and ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/kora-animal-audit-once.yml
          git rm .github/scripts/kora_animal_audit_once.py
          git add \
            eyes/KoraAnimalEyesV14_S3_PUBLIC/KoraAnimalEyesV14_S3_PUBLIC.ino \
            eyes/KoraAnimalEyesV14_S3_PUBLIC.zip
          git diff --cached --check
          git commit -m "Add light-reactive squint and LOOK control to Animal eyes"
          git push
