name: Kora Animal eye read-only audit once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kora-animal-audit-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit current Animal eye source
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/kora_animal_audit_once.py
