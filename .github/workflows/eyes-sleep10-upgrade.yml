name: Apply exact SLEEP10 eye sketches
on:
  push:
    paths:
      - .github/workflows/eyes-sleep10-upgrade.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified byte-exact changes
        run: python3 .github/eyes_sleep10_patch.py
      - name: Commit verified files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eyes .github
          git commit -m "Update Kora eye sketches with SLEEP10 versions"
          git push
# retry: exact TALK timer anchor
