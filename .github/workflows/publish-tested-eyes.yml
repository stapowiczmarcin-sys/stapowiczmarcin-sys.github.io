name: Publish tested Kora eyes

on:
  push:
    paths:
      - '.github/eye-patches/TRIGGER'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply tested firmware delta
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/eye-patches/final-tested.patch.b64 | bzip2 -dc > /tmp/final-tested.patch

          # The public V18 files have three small regions that drifted after the
          # original base snapshot. Apply every matching hunk first, then replace
          # those three regions with the exact text from the hardware-tested files.
          patch -p1 --batch --forward < /tmp/final-tested.patch || true

          python3 - <<'PY'
          from pathlib import Path
          import re

          files = {
              Path('eyes/KoraHumanMetalV18_S3_PUBLIC/KoraHumanMetalV18_S3_PUBLIC.ino'): '3, PIN_LIGHT_R=4',
              Path('eyes/KoraMetalEyesV18_S3_PUBLIC/KoraMetalEyesV18_S3_PUBLIC.ino'): '4, PIN_LIGHT_R=3',
              Path('eyes/KoraMonsterEyesV18_S3_PUBLIC/KoraMonsterEyesV18_S3_PUBLIC.ino'): '4, PIN_LIGHT_R=3',
          }

          def replace_one(text, pattern, replacement, label, path):
              out, n = re.subn(pattern, replacement, text, count=1, flags=re.M | re.S)
              if n != 1:
                  raise SystemExit(f'{path}: expected one {label} region, found {n}')
              return out

          draw_block = '''  float sqL = (quietMode || crtState == 2) ? 0.0f : lightSquintL;
          float sqR = (quietMode || crtState == 2) ? 0.0f : lightSquintR;

          oL *= (1.0f - 0.80f * sqL);
          oR *= (1.0f - 0.80f * sqR);


          '''

          serial_block = '''  if (upper == "LIST") { printBehaviorList(); return; }

          if (upper.startsWith("LOOK ")) {
            String arg = line.substring(5);
            arg.trim();
            int sep = arg.indexOf(' ');
            if (sep <= 0) { Serial.println("ERR LOOK x y (-1.0..1.0)"); return; }
            String sx = arg.substring(0, sep);
            String sy = arg.substring(sep + 1);
            sx.trim(); sy.trim();
            char *endX = nullptr, *endY = nullptr;
            float x = strtof(sx.c_str(), &endX);
            float y = strtof(sy.c_str(), &endY);
            if (!sx.length() || !sy.length() || *endX || *endY || x < -1.0f || x > 1.0f || y < -1.0f || y > 1.0f) {
              Serial.println("ERR LOOK x y (-1.0..1.0)");
              return;
            }
            if (quietMode) wakeFromPi(0, "idle_watch");
            lastInteractionMs = millis();
            autoSlept = false;
            faceTarget.lookX = x;
            faceTarget.lookY = y;
            Serial.println("OK LOOK " + String(x, 2) + " " + String(y, 2));
            return;
          }

            lastInteractionMs = millis();
            autoSlept = false;
            triggerEarPerk();
          '''

          for path, pins in files.items():
              light_block = f'''// ---------- ambient light sensors / czujniki swiatla ----------
          // LEFT = GPIO3, RIGHT = GPIO4.
          // Pupils use the averaged ambient level.
          // Eyelids use the SAME response curve/smoothing that previously produced
          // the good "sqL/sqR" squint, but now the source is light only.
          static constexpr int PIN_LIGHT_L={pins};
          static constexpr int LIGHT_DARK_L=0,LIGHT_BRIGHT_L=4095;
          static constexpr int LIGHT_DARK_R=0,LIGHT_BRIGHT_R=4095;

          // These thresholds intentionally match the previous proven squint response.
          // If your divider is later calibrated differently, only these two values need changing.
          static constexpr uint32_t LIGHT_SQUINT_START_RAW=120;
          static constexpr uint32_t LIGHT_SQUINT_FULL_RAW=1600;

          static bool lightLocalReady=false,lightRemoteSeen=false,lightLocalSeen=false;
          static float lightLocal=50,lightRemote=50;
          static uint32_t lightRemoteAt=0,lightSampleAt=0;
          static const char* lightSource="none";
          static uint32_t lightRawL=0,lightRawR=0;
          static float lightSquintL=0.0f,lightSquintR=0.0f;

          static float lightRawToSquint(uint32_t raw){
            if(raw<=LIGHT_SQUINT_START_RAW)return 0.0f;
            if(raw>=LIGHT_SQUINT_FULL_RAW)return 1.0f;
            return float(raw-LIGHT_SQUINT_START_RAW)/float(LIGHT_SQUINT_FULL_RAW-LIGHT_SQUINT_START_RAW);
          }}

          static uint32_t readLightRaw(int pin){
            uint32_t acc=0;
            for(int i=0;i<4;i++){
              acc+=analogRead(pin);
              delayMicroseconds(400);
            }}
            return acc/4;
          }}

          static bool lightPinValid(int p){
            // ADC1 only: Wi-Fi remains usable. Reject every already-assigned pin.
            const int occupied[]={{PIN_SCK,PIN_MOSI,PIN_CS_L,PIN_DC_L,PIN_RST_L,PIN_CS_R,PIN_DC_R,PIN_RST_R,PIN_EAR_L,PIN_EAR_R,PIN_MOUTH_L,PIN_MOUTH_R}};
            if(p<1||p>10)return false;
            for(int used:occupied)if(p==used)return false;
            return true;
          }}

          static void setupLightSensors(){
            lightLocalReady=lightPinValid(PIN_LIGHT_L)&&lightPinValid(PIN_LIGHT_R)&&PIN_LIGHT_L!=PIN_LIGHT_R&&LIGHT_DARK_L!=LIGHT_BRIGHT_L&&LIGHT_DARK_R!=LIGHT_BRIGHT_R;
            if(!lightLocalReady){{Serial.println("ERR LIGHT configuration; ADC disabled");return;}}
            pinMode(PIN_LIGHT_L,INPUT);
            pinMode(PIN_LIGHT_R,INPUT);
            analogSetPinAttenuation(PIN_LIGHT_L,ADC_11db);
            analogSetPinAttenuation(PIN_LIGHT_R,ADC_11db);
            Serial.println("LIGHT READY GPIO3(L)/GPIO4(R)");
          }}

          static void updateLightPupil(){
            uint32_t now=millis();
            if(lightLocalReady&&(!lightLocalSeen||uint32_t(now-lightSampleAt)>=25)){{
              lightSampleAt=now;
              lightLocalSeen=true;

              lightRawL=readLightRaw(PIN_LIGHT_L);
              lightRawR=readLightRaw(PIN_LIGHT_R);

              float l=KoraPupil::normalize(lightRawL,LIGHT_DARK_L,LIGHT_BRIGHT_L);
              float r=KoraPupil::normalize(lightRawR,LIGHT_DARK_R,LIGHT_BRIGHT_R);
              lightLocal=(l+r)*0.5f;

              // Same fast-close / gentle-release character as the previous good squint.
              float tL=lightRawToSquint(lightRawL);
              float tR=lightRawToSquint(lightRawR);
              float k=(tL>lightSquintL||tR>lightSquintR)?0.45f:0.18f;
              lightSquintL+=(tL-lightSquintL)*k;
              lightSquintR+=(tR-lightSquintR)*k;
            }}

            bool remoteFresh=lightRemoteSeen&&uint32_t(now-lightRemoteAt)<=2000;
            bool fresh=remoteFresh||lightLocalSeen;
            lightSource=remoteFresh?"serial":(lightLocalSeen?"adc_mean":(lightRemoteSeen?"serial_stale":"none"));
            KoraPupil::control.tick(now,fresh,remoteFresh?lightRemote:lightLocal);
          }}
          '''

              text = path.read_text(encoding='utf-8')
              text = replace_one(
                  text,
                  r'^// Ambient-light sensors:.*?(?=^static bool handleIrisPupil)',
                  light_block,
                  'light block',
                  path,
              )
              text = replace_one(
                  text,
                  r'^  float sqL = .*?(?=^  oL \*= displayPower\.lid;)',
                  draw_block,
                  'draw squint block',
                  path,
              )
              text = replace_one(
                  text,
                  r'^  if \(upper == "LIST"\) \{ printBehaviorList\(\); return; \}\n.*?^  triggerEarPerk\(\);\n',
                  serial_block,
                  'LIST/LOOK block',
                  path,
              )
              path.write_text(text, encoding='utf-8', newline='\n')

          for rej in Path('eyes').rglob('*.rej'):
              rej.unlink()
          PY

      - name: Verify exact tested source hashes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/eyes.sha256 <<'EOF'
          cf620a04d0c655c9a1d82bb14203252fcefd16a2fec45b9f592d710ece6af030  eyes/KoraHumanMetalV18_S3_PUBLIC/KoraHumanMetalV18_S3_PUBLIC.ino
          fadeefb0f9acaedcb9a58d17b743165260b37021eaf3d9487a094c01ae051853  eyes/KoraMetalEyesV18_S3_PUBLIC/KoraMetalEyesV18_S3_PUBLIC.ino
          c469400b230b5cb2bab4897ae1bd711c498ec3ec750dcf95a2a1bb68721f4c88  eyes/KoraMonsterEyesV18_S3_PUBLIC/KoraMonsterEyesV18_S3_PUBLIC.ino
          109b7e376f34329aa5831ba43a451932e6f49efee88af0572480ee39e2c58133  eyes/KoraAnimalEyesV14_S3_PUBLIC/KoraAnimalEyesV14_S3_PUBLIC.ino
          EOF
          sha256sum -c /tmp/eyes.sha256

      - name: Rebuild download ZIPs and V18 manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, re, shutil, zipfile

          pairs = {
              Path('eyes/KoraHumanMetalV18_S3_PUBLIC.zip'): Path('eyes/KoraHumanMetalV18_S3_PUBLIC/KoraHumanMetalV18_S3_PUBLIC.ino'),
              Path('eyes/KoraMetalEyesV18_S3_PUBLIC.zip'): Path('eyes/KoraMetalEyesV18_S3_PUBLIC/KoraMetalEyesV18_S3_PUBLIC.ino'),
              Path('eyes/KoraMonsterEyesV18_S3_PUBLIC.zip'): Path('eyes/KoraMonsterEyesV18_S3_PUBLIC/KoraMonsterEyesV18_S3_PUBLIC.ino'),
              Path('eyes/KoraAnimalEyesV14_S3_PUBLIC.zip'): Path('eyes/KoraAnimalEyesV14_S3_PUBLIC/KoraAnimalEyesV14_S3_PUBLIC.ino'),
          }

          for zpath, ino in pairs.items():
              tmp = zpath.with_suffix(zpath.suffix + '.tmp')
              replaced = 0
              with zipfile.ZipFile(zpath, 'r') as src, zipfile.ZipFile(tmp, 'w') as dst:
                  for info in src.infolist():
                      data = src.read(info.filename)
                      if PurePosixPath(info.filename).name == ino.name:
                          data = ino.read_bytes()
                          replaced += 1
                      dst.writestr(info, data)
              if replaced != 1:
                  tmp.unlink(missing_ok=True)
                  raise SystemExit(f'{zpath}: expected exactly one {ino.name}, found {replaced}')
              shutil.move(tmp, zpath)
              with zipfile.ZipFile(zpath, 'r') as check:
                  bad = check.testzip()
                  if bad:
                      raise SystemExit(f'{zpath}: CRC failure in {bad}')
              print('ZIP OK', zpath, hashlib.sha256(zpath.read_bytes()).hexdigest())

          manifest = Path('eyes/SHA256_V18.json')
          if manifest.exists():
              text = manifest.read_text(encoding='utf-8')
              for zpath in list(pairs)[:3]:
                  digest = hashlib.sha256(zpath.read_bytes()).hexdigest()
                  pat = rf'("{re.escape(zpath.name)}"\s*:\s*")[0-9a-f]{{64}}(")'
                  text, n = re.subn(pat, rf'\g<1>{digest}\g<2>', text, count=1)
                  if n != 1:
                      raise SystemExit(f'manifest entry not found: {zpath.name}')
              manifest.write_text(text, encoding='utf-8')
          PY

      - name: Commit tested builds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            eyes/KoraHumanMetalV18_S3_PUBLIC/KoraHumanMetalV18_S3_PUBLIC.ino \
            eyes/KoraMetalEyesV18_S3_PUBLIC/KoraMetalEyesV18_S3_PUBLIC.ino \
            eyes/KoraMonsterEyesV18_S3_PUBLIC/KoraMonsterEyesV18_S3_PUBLIC.ino \
            eyes/KoraAnimalEyesV14_S3_PUBLIC/KoraAnimalEyesV14_S3_PUBLIC.ino \
            eyes/KoraHumanMetalV18_S3_PUBLIC.zip \
            eyes/KoraMetalEyesV18_S3_PUBLIC.zip \
            eyes/KoraMonsterEyesV18_S3_PUBLIC.zip \
            eyes/KoraAnimalEyesV14_S3_PUBLIC.zip \
            eyes/SHA256_V18.json
          git diff --cached --quiet && { echo 'No changes to publish'; exit 0; }
          git commit -m 'Publish four hardware-tested Kora eye builds (LIGHT5S)'
          git push
