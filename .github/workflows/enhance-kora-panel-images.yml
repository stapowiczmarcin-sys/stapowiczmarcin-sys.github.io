name: Enhance Kora Brain panel images

on:
  push:
    paths:
      - '.github/workflows/enhance-kora-panel-images.yml'

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick

      - name: Upscale and clean panel screenshots
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(kora-brain/panels/2026-08-16/*.jpg)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No panel screenshots found'
            exit 1
          fi

          for f in "${files[@]}"; do
            tmp="${f%.jpg}.enhanced.jpg"
            echo "Enhancing $f"

            if ffmpeg -hide_banner -loglevel error -err_detect ignore_err -y -i "$f" \
              -vf "scale=iw*4:ih*4:flags=lanczos,eq=contrast=1.045:saturation=1.025,unsharp=5:5:0.55:5:5:0.0" \
              -q:v 2 "$tmp"; then
              mv "$tmp" "$f"
              continue
            fi

            rm -f "$tmp"
            if command -v magick >/dev/null 2>&1; then
              magick "$f" -resize 400% -contrast-stretch 0.2%x0.2% -unsharp 0x1+0.65+0.02 -quality 96 "$tmp"
              mv "$tmp" "$f"
              continue
            fi
            if command -v convert >/dev/null 2>&1; then
              convert "$f" -resize 400% -contrast-stretch 0.2%x0.2% -unsharp 0x1+0.65+0.02 -quality 96 "$tmp"
              mv "$tmp" "$f"
              continue
            fi

            echo "Could not decode $f"
            exit 1
          done

          python3 - <<'PY'
          from pathlib import Path
          page = Path('kora-brain/index.html')
          text = page.read_text(encoding='utf-8')
          old = '.live-shot img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.live-shot:first-child img{aspect-ratio:16/8;object-position:center}'
          new = '.live-shot img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#04070a;image-rendering:auto;filter:contrast(1.04) saturate(1.04);transition:transform .22s ease,filter .22s ease}.live-shot a:hover img{transform:scale(1.008);filter:contrast(1.06) saturate(1.06)}.live-shot:first-child img{aspect-ratio:16/9;object-fit:contain;object-position:center;background:#04070a}'
          if old not in text:
              raise SystemExit('Expected live-shot CSS block not found; refusing unsafe patch')
          page.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit improved images
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kora-brain/index.html kora-brain/panels/2026-08-16/*.jpg
          git commit -m 'Improve Kora Brain panel image quality'
          git push
