name: Shorten header labels
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shorten labels
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<a class="button" href="https://stapowiczmarcin-sys\.github\.io/parts/#catalog" target="_blank" rel="noopener" data-pl="[^"]*" data-en="[^"]*">[^<]*</a>', '<a class="button" href="https://stapowiczmarcin-sys.github.io/parts/#catalog" target="_blank" rel="noopener" data-pl="Cz&#281;&#347;ci" data-en="Parts">Cz&#281;&#347;ci</a>', s, count=1)
          s = re.sub(r'<a class="button button-gotchas" href="https://stapowiczmarcin-sys\.github\.io/parts/#gotchas" target="_blank" rel="noopener" data-pl="[^"]*" data-en="[^"]*">[^<]*</a>', '<a class="button button-gotchas" href="https://stapowiczmarcin-sys.github.io/parts/#gotchas" target="_blank" rel="noopener" data-pl="&#129324; Pu&#322;apki cz&#281;&#347;ci" data-en="&#129324; Part traps">&#129324; Pu&#322;apki cz&#281;&#347;ci</a>', s, count=1)
          s = re.sub(r'<a class="button" href="kora-brain/" data-pl="[^"]*" data-en="[^"]*">[^<]*</a>', '<a class="button" href="kora-brain/" data-pl="M&#243;zg Kory" data-en="Kora brain">M&#243;zg Kory</a>', s, count=1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name Morrcin
          git config user.email stapowiczmarcin@gmail.com
          git add index.html
          git commit -m 'Shorten portfolio header labels'
          git rm .github/workflows/shorten-header-labels.yml
          git commit -m 'Remove temporary label workflow'
          git push
