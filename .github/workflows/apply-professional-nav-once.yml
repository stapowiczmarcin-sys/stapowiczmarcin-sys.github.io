name: Apply professional navigation patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-professional-nav-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/professional-nav-2026-08-17
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate patch script
        run: python -m py_compile tools/patch_professional_nav.py
      - name: Apply navigation patch
        run: python tools/patch_professional_nav.py
      - name: Validate generated page
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          assert text.count('id="languageSelect"') == 1
          assert text.count('id="navMenuToggle"') == 1
          assert text.count('id="siteNavPanel"') == 1
          assert text.count('professional-nav-2026-08-17') >= 3
          assert '<main id="start">' in text
          assert '<section id="kora">' in text
          assert '<section id="kontakt">' in text
          assert 'data-pl="Elektronika" data-en="Electronics"' in text
          assert 'data-pl="Części" data-en="Parts"' in text
          print('Portfolio navigation invariants OK')
          PY
          git diff --check
      - name: Commit only the patched page to isolated branch
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: professional responsive portfolio navigation'
          git push origin HEAD:fix/professional-nav-2026-08-17
