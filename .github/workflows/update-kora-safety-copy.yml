name: Update Kora safety copy

on:
  push:
    paths:
      - '.github/workflows/update-kora-safety-copy.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace safety text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kora-brain/index.html')
          text = p.read_text(encoding='utf-8')
          old = '<div class="safety"><strong data-pl="Najważniejsza zasada: bezpieczeństwo ma pierwszeństwo" data-en="Most important rule: safety comes first">Najważniejsza zasada: bezpieczeństwo ma pierwszeństwo</strong><p data-pl="STOP, release, PWM-off i mechanizmy awaryjne muszą omijać humor, sarkazm i ciężkie modele." data-en="STOP, release, PWM-off and emergency mechanisms must bypass humour, sarcasm and heavy models.">STOP, release, PWM-off i mechanizmy awaryjne muszą omijać humor, sarkazm i ciężkie modele.</p></div>'
          new = '<div class="safety"><strong data-pl="Awaryjne sterowanie działa poza warstwą rozmowy" data-en="Emergency control runs outside the conversation layer">Awaryjne sterowanie działa poza warstwą rozmowy</strong><p data-pl="STOP, release i PWM-off mają własną lekką ścieżkę lokalną — bez czekania na model językowy, nastrój ani warstwę osobowości." data-en="STOP, release and PWM-off use their own lightweight local path — without waiting for the language model, mood system or personality layer.">STOP, release i PWM-off mają własną lekką ścieżkę lokalną — bez czekania na model językowy, nastrój ani warstwę osobowości.</p></div>'
          if old not in text:
              raise SystemExit('Expected safety block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit and clean up
        shell: bash
        run: |
          rm .github/workflows/update-kora-safety-copy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kora-brain/index.html .github/workflows/update-kora-safety-copy.yml
          git commit -m 'Refine Kora emergency control wording'
          git push
