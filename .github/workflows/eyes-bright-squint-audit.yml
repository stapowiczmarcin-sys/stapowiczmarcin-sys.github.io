name: Eyes bright squint audit
on:
  push:
    branches: [tmp/eyes-bright-squint-audit-2026-09-29]
    paths: ['.github/workflows/eyes-bright-squint-audit.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect four eye sketches
        shell: bash
        run: |
          set -euo pipefail
          files=(
            eyes/KoraHumanMetalV18_S3_PUBLIC/KoraHumanMetalV18_S3_PUBLIC.ino
            eyes/KoraMetalEyesV18_S3_PUBLIC/KoraMetalEyesV18_S3_PUBLIC.ino
            eyes/KoraMonsterEyesV18_S3_PUBLIC/KoraMonsterEyesV18_S3_PUBLIC.ino
            eyes/KoraAnimalEyesV14_S3_PUBLIC/KoraAnimalEyesV14_S3_PUBLIC.ino
          )
          for f in "${files[@]}"; do
            echo "===== $f ====="
            grep -n -E 'PIN_LIGHT_|updateLightPupil|lightPupilOffset|lightFiltered|drawFace\(|float oL|displayPower\.lid|faceNow\.openL|setupLightSensors|void setup\(|void loop\(' "$f" | tail -n 80
            echo "--- LIGHT CONTEXT ---"
            n=$(grep -n 'PIN_LIGHT_L' "$f" | tail -1 | cut -d: -f1); sed -n "$((n-8)),$((n+65))p" "$f"
            echo "--- DRAW CONTEXT ---"
            n=$(grep -n 'static void drawFace()' "$f" | tail -1 | cut -d: -f1); sed -n "$((n+10)),$((n+75))p" "$f"
            echo "--- SETUP/LOOP CALLS ---"
            grep -n -E 'setupLightSensors\(\)|updateLightPupil\(\)' "$f" | tail -20
          done
