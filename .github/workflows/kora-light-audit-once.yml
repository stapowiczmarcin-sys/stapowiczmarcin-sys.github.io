name: Kora light audit once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kora-light-audit-once.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit four eye sketches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [
            Path('eyes/KoraHumanMetalV18_S3_PUBLIC/KoraHumanMetalV18_S3_PUBLIC.ino'),
            Path('eyes/KoraMetalEyesV18_S3_PUBLIC/KoraMetalEyesV18_S3_PUBLIC.ino'),
            Path('eyes/KoraMonsterEyesV18_S3_PUBLIC/KoraMonsterEyesV18_S3_PUBLIC.ino'),
            Path('eyes/KoraAnimalEyesV14_S3_PUBLIC/KoraAnimalEyesV14_S3_PUBLIC.ino'),
          ]
          keys = ('PIN_LIGHT_L','PIN_LIGHT_R','updateLightPupil','setupLightSensors','KoraPupil','PUPIL ','analogRead(','PIN_FSR_L','PIN_FSR_R')
          for p in paths:
            print(f'=== {p} ===')
            s = p.read_text(encoding='utf-8', errors='replace')
            print('bytes=', len(s.encode('utf-8')), 'lines=', s.count('\n')+1)
            for i,line in enumerate(s.splitlines(),1):
              if any(k in line for k in keys):
                print(f'{i}: {line[:240]}')
          PY
      - name: Remove audit workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/kora-light-audit-once.yml
          git commit -m "Remove temporary Kora light audit workflow"
          git push
