name: Kora V18 eye source audit once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kora-light-squint-finalize-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit current three V18 eye sources
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/kora_light_squint_finalize_once.py
