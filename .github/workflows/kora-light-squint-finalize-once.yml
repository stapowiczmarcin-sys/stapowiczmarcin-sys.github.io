name: Kora V18 light squint finalizer once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kora-light-squint-finalize-once.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate current three V18 sources
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/if not(target(65)==0 and target(80)==0.25 and target(92)==0.60 and abs(target(100)-0.90)<1e-9):/if not(abs(target(65)-0.0)<1e-9 and abs(target(80)-0.25)<1e-9 and abs(target(92)-0.60)<1e-9 and abs(target(100)-0.90)<1e-9):/' .github/scripts/kora_light_squint_finalize_once.py
          python3 .github/scripts/kora_light_squint_finalize_once.py
          git diff --check
          echo '--- SOURCE NUMSTAT ---'
          git diff --numstat -- \
            eyes/KoraHumanMetalV18_S3_PUBLIC/KoraHumanMetalV18_S3_PUBLIC.ino \
            eyes/KoraMetalEyesV18_S3_PUBLIC/KoraMetalEyesV18_S3_PUBLIC.ino \
            eyes/KoraMonsterEyesV18_S3_PUBLIC/KoraMonsterEyesV18_S3_PUBLIC.ino | tee /tmp/numstat.txt
          awk -F '\t' '($1=="-" || $2=="-"){exit 10} (($1+$2)>140){exit 11} END{if(NR!=3)exit 12}' /tmp/numstat.txt
          echo '--- STATUS ---'
          git status --short
      - name: Commit sources ZIPs and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch .github/workflows/kora-light-squint-finalize-once.yml
          git rm -f --ignore-unmatch .github/scripts/kora_light_squint_finalize_once.py
          git rm -f --ignore-unmatch .github/workflows/kora_gpio34_lineendings_fix.yml
          git rm -f --ignore-unmatch .github/scripts/kora_gpio34_lineendings_fix.py
          git add \
            eyes/KoraHumanMetalV18_S3_PUBLIC/KoraHumanMetalV18_S3_PUBLIC.ino \
            eyes/KoraMetalEyesV18_S3_PUBLIC/KoraMetalEyesV18_S3_PUBLIC.ino \
            eyes/KoraMonsterEyesV18_S3_PUBLIC/KoraMonsterEyesV18_S3_PUBLIC.ino \
            eyes/KoraHumanMetalV18_S3_PUBLIC.zip \
            eyes/KoraMetalEyesV18_S3_PUBLIC.zip \
            eyes/KoraMonsterEyesV18_S3_PUBLIC.zip \
            eyes/SHA256_V18.json
          git diff --cached --check
          git commit -m "Add light-reactive squint and LOOK control to Kora V18 eyes"
          git push
