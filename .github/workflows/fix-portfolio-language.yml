name: Fix portfolio language selector
on:
  push:
    paths:
      - '.github/workflows/fix-portfolio-language.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch portfolio languages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('<html lang="pl">', '<html lang="en" class="lang-loading">', 1)
          s = s.replace('<meta name="description" content="Portfolio Marcina — samodzielnie budowane maszyny CNC, robotyka, elektronika i prototypowanie.">', '<meta name="description" content="Marcin’s maker portfolio — self-built CNC machines, robotics, electronics and practical prototyping.">', 1)
          s = s.replace('<title>Marcin — konstruktor i praktyczny prototypista</title>', '<title>Marcin — maker and hands-on prototyper</title>', 1)

          css_anchor = '    .button:hover { border-color: rgba(255,154,69,.65); background: rgba(255,154,69,.09); }\n'
          css_add = '''    .lang-loading body { visibility: hidden; }\n    .language-picker {\n      display: inline-flex;\n      align-items: center;\n      gap: 7px;\n      min-height: 42px;\n      padding: 0 9px 0 11px;\n      border: 1px solid var(--line);\n      border-radius: 999px;\n      background: rgba(255,255,255,.04);\n      color: var(--text);\n    }\n    .language-picker:hover { border-color: rgba(107,224,193,.6); background: rgba(107,224,193,.08); }\n    .language-globe { font-size: .9rem; opacity: .9; }\n    .language-picker select {\n      border: 0;\n      outline: 0;\n      color: var(--text);\n      background: transparent;\n      font: inherit;\n      font-size: .78rem;\n      font-weight: 850;\n      cursor: pointer;\n    }\n    .language-picker option { color: #111; background: #fff; }\n'''
          if css_add not in s:
              if css_anchor not in s:
                  raise SystemExit('CSS anchor not found')
              s = s.replace(css_anchor, css_anchor + css_add, 1)

          old_lang = re.search(r'<button class="button" id="languageButton" type="button" aria-label="[^"]*"><span>PL / EN</span></button>', s)
          if not old_lang:
              raise SystemExit('language button not found')
          new_lang = '<label class="language-picker" aria-label="Language"><span class="language-globe" aria-hidden="true">🌐</span><select id="languageSelect" aria-label="Language"><option value="en">EN</option><option value="pl">PL</option><option value="de">DE</option></select></label>'
          s = s[:old_lang.start()] + new_lang + s[old_lang.end():]

          mobile_anchor = '      .top-actions .button { width: 100%; min-width: 0; white-space: normal; line-height: 1.15; text-align: center; }\n'
          mobile_add = '      .top-actions .language-picker { width: 100%; min-height: 38px; justify-content: center; }\n'
          if mobile_add not in s and mobile_anchor in s:
              s = s.replace(mobile_anchor, mobile_anchor + mobile_add, 1)

          s = s.replace('  <script>\n    const languageButton = document.getElementById(\'languageButton\');', '  <script src="portfolio-de.js"></script>\n  <script>\n    const languageSelect = document.getElementById(\'languageSelect\');', 1)
          s = s.replace("    let language = localStorage.getItem('portfolio-language') || 'pl';", "    let language = 'en';", 1)

          helper_anchor = '    let activeStackButton = stackButtons[0] || null;\n\n'
          helper = '''    const deTranslations = window.PORTFOLIO_DE || {};\n\n    function translated(enText, plText) {\n      if (language === 'de') return deTranslations[enText] || enText || '';\n      return language === 'pl' ? (plText || enText || '') : (enText || plText || '');\n    }\n\n'''
          if helper not in s:
              if helper_anchor not in s:
                  raise SystemExit('helper anchor not found')
              s = s.replace(helper_anchor, helper_anchor + helper, 1)

          s = s.replace('      stackDetailTitle.textContent = button.dataset[`${language}Title`];\n      stackDetailCopy.textContent = button.dataset[`${language}Copy`];\n      stackDetailLink.textContent = button.dataset[`${language}Link`];', "      stackDetailTitle.textContent = translated(button.dataset.enTitle, button.dataset.plTitle);\n      stackDetailCopy.textContent = translated(button.dataset.enCopy, button.dataset.plCopy);\n      stackDetailLink.textContent = translated(button.dataset.enLink, button.dataset.plLink);", 1)

          apply_pattern = re.compile(r'''    function applyLanguage\(\) \{\n      document\.documentElement\.lang = language;\n      document\.querySelectorAll\('\[data-pl\]\[data-en\]'\)\.forEach\(\(element\) => \{\n        element\.textContent = element\.dataset\[language\];\n      \}\);\n      languageButton\.textContent = language === 'pl' \? 'PL / EN' : 'EN / PL';\n      languageButton\.setAttribute\('aria-label', language === 'pl' \? 'Zmień język na angielski' : 'Switch language to Polish'\);\n      document\.title = language === 'pl'\n        \? 'Marcin — konstruktor i praktyczny prototypista'\n        : 'Marcin — maker and hands-on prototyper';\n      renderStackDetail\(activeStackButton\);\n      localStorage\.setItem\('portfolio-language', language\);\n    \}\n\n    languageButton\.addEventListener\('click', \(\) => \{\n      language = language === 'pl' \? 'en' : 'pl';\n      applyLanguage\(\);\n    \}\);''')
          apply_new = '''    function applyLanguage() {\n      document.documentElement.lang = language;\n      document.querySelectorAll('[data-pl][data-en]').forEach((element) => {\n        element.textContent = translated(element.dataset.en, element.dataset.pl);\n      });\n      languageSelect.value = language;\n      document.title = language === 'pl'\n        ? 'Marcin — konstruktor i praktyczny prototypista'\n        : language === 'de'\n          ? 'Marcin — Konstrukteur und praxisorientierter Prototypenbauer'\n          : 'Marcin — maker and hands-on prototyper';\n      renderStackDetail(activeStackButton);\n      document.documentElement.classList.remove('lang-loading');\n    }\n\n    languageSelect.addEventListener('change', () => {\n      language = languageSelect.value;\n      applyLanguage();\n    });'''
          s, n = apply_pattern.subn(apply_new, s, count=1)
          if n != 1:
              raise SystemExit('applyLanguage block not found')

          s = s.replace("          copyLampCodeButton.textContent = language === 'pl' ? 'Skopiowano ✓' : 'Copied ✓';", "          copyLampCodeButton.textContent = language === 'pl' ? 'Skopiowano ✓' : language === 'de' ? 'Kopiert ✓' : 'Copied ✓';", 1)
          s = s.replace('            copyLampCodeButton.textContent = copyLampCodeButton.dataset[language];', '            copyLampCodeButton.textContent = translated(copyLampCodeButton.dataset.en, copyLampCodeButton.dataset.pl);', 1)
          s = s.replace("          copyLampCodeButton.textContent = language === 'pl' ? 'Zaznacz kod ręcznie' : 'Select the code manually';", "          copyLampCodeButton.textContent = language === 'pl' ? 'Zaznacz kod ręcznie' : language === 'de' ? 'Code manuell auswählen' : 'Select the code manually';", 1)
          s = s.replace("          copyYoutubeDescriptionButton.textContent = language === 'pl' ? 'Skopiowano ✓' : 'Copied ✓';", "          copyYoutubeDescriptionButton.textContent = language === 'pl' ? 'Skopiowano ✓' : language === 'de' ? 'Kopiert ✓' : 'Copied ✓';", 1)
          s = s.replace('            copyYoutubeDescriptionButton.textContent = copyYoutubeDescriptionButton.dataset[language];', '            copyYoutubeDescriptionButton.textContent = translated(copyYoutubeDescriptionButton.dataset.en, copyYoutubeDescriptionButton.dataset.pl);', 1)
          s = s.replace("          copyYoutubeDescriptionButton.textContent = language === 'pl' ? 'Zaznacz tekst ręcznie' : 'Select the text manually';", "          copyYoutubeDescriptionButton.textContent = language === 'pl' ? 'Zaznacz tekst ręcznie' : language === 'de' ? 'Text manuell auswählen' : 'Select the text manually';", 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'Morrcin'
          git config user.email 'stapowiczmarcin@gmail.com'
          git add index.html
          git commit -m 'Make English default and add Polish German selector'
          git push
