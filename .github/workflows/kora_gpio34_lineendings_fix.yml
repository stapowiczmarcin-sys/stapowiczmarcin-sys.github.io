name: Kora GPIO34 byte-preserving cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kora_gpio34_lineendings_fix.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore native line endings and reapply intended changes
        run: |
          set -euo pipefail
          python3 .github/scripts/kora_gpio34_lineendings_fix.py
          git diff --check
          echo '--- intended source diff versus pre-change commit ---'
          git diff --stat 30db11179c660ea46acd371936a95bb2afc1a1d3 -- eyes/KoraHumanMetalV18_S3_PUBLIC/KoraHumanMetalV18_S3_PUBLIC.ino eyes/KoraMetalEyesV18_S3_PUBLIC/KoraMetalEyesV18_S3_PUBLIC.ino eyes/KoraMonsterEyesV18_S3_PUBLIC/KoraMonsterEyesV18_S3_PUBLIC.ino eyes/KoraAnimalEyesV14_S3_PUBLIC/KoraAnimalEyesV14_S3_PUBLIC.ino
      - name: Commit cleanup and remove helpers
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/kora_gpio34_lineendings_fix.yml
          git rm .github/scripts/kora_gpio34_lineendings_fix.py
          git add eyes/KoraHumanMetalV18_S3_PUBLIC/KoraHumanMetalV18_S3_PUBLIC.ino eyes/KoraMetalEyesV18_S3_PUBLIC/KoraMetalEyesV18_S3_PUBLIC.ino eyes/KoraMonsterEyesV18_S3_PUBLIC/KoraMonsterEyesV18_S3_PUBLIC.ino eyes/KoraAnimalEyesV14_S3_PUBLIC/KoraAnimalEyesV14_S3_PUBLIC.ino eyes/KoraHumanMetalV18_S3_PUBLIC.zip eyes/KoraMetalEyesV18_S3_PUBLIC.zip eyes/KoraMonsterEyesV18_S3_PUBLIC.zip eyes/KoraAnimalEyesV14_S3_PUBLIC.zip eyes/SHA256_V18.json
          git diff --cached --check
          git commit -m "Preserve eye source line endings for GPIO3 GPIO4 update"
          git push
