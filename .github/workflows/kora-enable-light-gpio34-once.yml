name: Enable Kora light sensors GPIO3 GPIO4 once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kora-enable-light-gpio34-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update eye sources and download ZIPs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, json, shutil, zipfile
          v18 = [
              Path('eyes/KoraHumanMetalV18_S3_PUBLIC/KoraHumanMetalV18_S3_PUBLIC.ino'),
              Path('eyes/KoraMetalEyesV18_S3_PUBLIC/KoraMetalEyesV18_S3_PUBLIC.ino'),
              Path('eyes/KoraMonsterEyesV18_S3_PUBLIC/KoraMonsterEyesV18_S3_PUBLIC.ino'),
          ]
          animal = Path('eyes/KoraAnimalEyesV14_S3_PUBLIC/KoraAnimalEyesV14_S3_PUBLIC.ino')
          for p in v18:
              s = p.read_text(encoding='utf-8')
              old = 'static constexpr int PIN_LIGHT_L=-1, PIN_LIGHT_R=-1;'
              new = 'static constexpr int PIN_LIGHT_L=3, PIN_LIGHT_R=4;'
              if s.count(old) != 1:
                  raise SystemExit(f'{p}: disabled light declaration count={s.count(old)}')
              s = s.replace(old, new, 1)
              s = s.replace('// Disabled until the actual sensor GPIOs and divider calibration are supplied.', '// Ambient light sensors / czujniki swiatla: LEFT GPIO3, RIGHT GPIO4.', 1)
              if s.count(new) != 1 or 'analogRead(PIN_LIGHT_L)' not in s or 'analogRead(PIN_LIGHT_R)' not in s:
                  raise SystemExit(f'{p}: dual light validation failed')
              if s.count('{') != s.count('}'):
                  raise SystemExit(f'{p}: brace balance failed')
              p.write_text(s, encoding='utf-8')
              print('V18 OK', p)
          s = animal.read_text(encoding='utf-8')
          if 'PIN_LIGHT_L' in s or 'updateLightPupil()' in s:
              raise SystemExit('Animal already has light module; refusing duplicate')
          pin_anchor = 'static constexpr int PIN_FSR_R = 2;    // ADC1_CH1 - right / prawa\n'
          if s.count(pin_anchor) != 1:
              raise SystemExit(f'Animal FSR anchor count={s.count(pin_anchor)}')
          block_b64 = ''
          light_block = base64.b64decode(block_b64).decode('utf-8')
          s = s.replace(pin_anchor, pin_anchor + light_block, 1)
          render_old = 'float pupilL = clampF(faceNow.pupil + pupilBreath - sqL * 0.30f, 0.05f, 1.0f);'
          render_new = 'float pupilL = clampF(faceNow.pupil + pupilBreath + lightPupilOffset - sqL * 0.30f, 0.05f, 1.0f);'
          if s.count(render_old) != 1:
              raise SystemExit(f'Animal pupil render anchor count={s.count(render_old)}')
          s = s.replace(render_old, render_new, 1)
          setup_anchor = 'analogSetPinAttenuation(PIN_FSR_R, ADC_11db);\n'
          if s.count(setup_anchor) != 1:
              raise SystemExit(f'Animal setup anchor count={s.count(setup_anchor)}')
          s = s.replace(setup_anchor, setup_anchor + '  setupLightSensors();\n', 1)
          loop_anchor = 'void loop() {\n'
          if s.count(loop_anchor) != 1:
              raise SystemExit(f'Animal loop anchor count={s.count(loop_anchor)}')
          s = s.replace(loop_anchor, loop_anchor + '  updateLightPupil();\n', 1)
          for needle in ['static constexpr int PIN_LIGHT_L = 3;', 'static constexpr int PIN_LIGHT_R = 4;', 'analogRead(PIN_LIGHT_L)', 'analogRead(PIN_LIGHT_R)', '+ lightPupilOffset - sqL * 0.30f']:
              if needle not in s:
                  raise SystemExit(f'Animal missing {needle}')
          if s.count('{') != s.count('}'):
              raise SystemExit('Animal brace balance failed')
          animal.write_text(s, encoding='utf-8')
          print('ANIMAL OK', animal)
          zip_map = {
              Path('eyes/KoraHumanMetalV18_S3_PUBLIC.zip'): v18[0],
              Path('eyes/KoraMetalEyesV18_S3_PUBLIC.zip'): v18[1],
              Path('eyes/KoraMonsterEyesV18_S3_PUBLIC.zip'): v18[2],
              Path('eyes/KoraAnimalEyesV14_S3_PUBLIC.zip'): animal,
          }
          for zpath, ino in zip_map.items():
              if not zpath.exists():
                  raise SystemExit(f'Missing ZIP {zpath}')
              tmp = zpath.with_name(zpath.name + '.tmp')
              replaced = 0
              with zipfile.ZipFile(zpath, 'r') as src, zipfile.ZipFile(tmp, 'w') as dst:
                  for info in src.infolist():
                      data = src.read(info.filename)
                      if PurePosixPath(info.filename).name == ino.name:
                          data = ino.read_bytes()
                          replaced += 1
                      dst.writestr(info, data)
              if replaced != 1:
                  tmp.unlink(missing_ok=True)
                  raise SystemExit(f'{zpath}: INO replacement count={replaced}')
              shutil.move(tmp, zpath)
              with zipfile.ZipFile(zpath, 'r') as check:
                  if check.testzip() is not None:
                      raise SystemExit(f'{zpath}: CRC validation failed')
              print('ZIP OK', zpath)
          manifest_path = Path('eyes/SHA256_V18.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for zpath in list(zip_map.keys())[:3]:
              manifest[zpath.name] = hashlib.sha256(zpath.read_bytes()).hexdigest()
              print('SHA256', zpath.name, manifest[zpath.name])
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          for p in v18:
              t = p.read_text(encoding='utf-8')
              assert t.count('static constexpr int PIN_LIGHT_L=3, PIN_LIGHT_R=4;') == 1
              assert 'PIN_LIGHT_L=-1' not in t and 'PIN_LIGHT_R=-1' not in t
          print('ALL VALIDATION PASSED')
          PY
          git diff --check
          git diff --stat
          grep -n 'PIN_LIGHT_L' eyes/KoraHumanMetalV18_S3_PUBLIC/KoraHumanMetalV18_S3_PUBLIC.ino eyes/KoraMetalEyesV18_S3_PUBLIC/KoraMetalEyesV18_S3_PUBLIC.ino eyes/KoraMonsterEyesV18_S3_PUBLIC/KoraMonsterEyesV18_S3_PUBLIC.ino eyes/KoraAnimalEyesV14_S3_PUBLIC/KoraAnimalEyesV14_S3_PUBLIC.ino | head -20
      - name: Commit update and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/kora-enable-light-gpio34-once.yml
          git add eyes/KoraHumanMetalV18_S3_PUBLIC/KoraHumanMetalV18_S3_PUBLIC.ino eyes/KoraMetalEyesV18_S3_PUBLIC/KoraMetalEyesV18_S3_PUBLIC.ino eyes/KoraMonsterEyesV18_S3_PUBLIC/KoraMonsterEyesV18_S3_PUBLIC.ino eyes/KoraAnimalEyesV14_S3_PUBLIC/KoraAnimalEyesV14_S3_PUBLIC.ino eyes/KoraHumanMetalV18_S3_PUBLIC.zip eyes/KoraMetalEyesV18_S3_PUBLIC.zip eyes/KoraMonsterEyesV18_S3_PUBLIC.zip eyes/KoraAnimalEyesV14_S3_PUBLIC.zip eyes/SHA256_V18.json
          git diff --cached --check
          git commit -m "Enable dual eye light sensors on GPIO3 and GPIO4"
          git push
