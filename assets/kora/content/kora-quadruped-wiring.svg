<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Kora quadruped wiring: ESP32, PCA9685, OLED and two VL53L1X sensors</title>
  <desc id="desc">Technical wiring diagram showing shared I2C on GPIO21 and GPIO22, separate XSHUT pins on GPIO26 and GPIO27, separate regulated servo power and a required common ground.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#11182b"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .box{fill:#101c2e;stroke:#5d6d87;stroke-width:3}.module{fill:#14243a;stroke:#71839e;stroke-width:3}.t{font-family:Inter,Arial,sans-serif;fill:#f6f8ff}.h{font-size:34px;font-weight:800}.m{font-size:24px;font-weight:700}.s{font-size:18px}.xs{font-size:16px}.pin{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:18px;font-weight:700}.line{fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:5}.dot{stroke:#07111f;stroke-width:3}
    </style>
  </defs>
  <rect width="1600" height="1050" rx="36" fill="url(#bg)"/>
  <text class="t h" x="70" y="72">KORA — WIRING / SCHEMAT POŁĄCZEŃ</text>
  <text class="t s" x="70" y="108" opacity=".72">ESP32-WROOM-32 · PCA9685 · OLED 128×64 · 2× VL53L1X · 12× RDS3115MG</text>

  <rect class="box" x="90" y="190" width="430" height="520" rx="28"/>
  <text class="t h" x="135" y="250">ESP32-WROOM-32</text>
  <text class="t s" x="135" y="286" opacity=".68">3.3 V logic / logika 3,3 V</text>
  <g class="t pin">
    <text x="135" y="370">GPIO21 · SDA</text><circle cx="480" cy="363" r="10" fill="#43dcff" class="dot"/>
    <text x="135" y="430">GPIO22 · SCL</text><circle cx="480" cy="423" r="10" fill="#b68cff" class="dot"/>
    <text x="135" y="510">GPIO26 · XSHUT LEFT</text><circle cx="480" cy="503" r="10" fill="#ffe16b" class="dot"/>
    <text x="135" y="570">GPIO27 · XSHUT RIGHT</text><circle cx="480" cy="563" r="10" fill="#ff9a54" class="dot"/>
    <text x="135" y="630">3V3 · LOGIC POWER</text><circle cx="480" cy="623" r="10" fill="#64efbd" class="dot"/>
    <text x="135" y="680">GND · COMMON</text><circle cx="480" cy="673" r="10" fill="#dce4f2" class="dot"/>
  </g>

  <rect class="module" x="920" y="155" width="590" height="230" rx="24"/>
  <text class="t h" x="965" y="215">PCA9685 · 0x40</text>
  <text class="t s" x="965" y="253">16-channel PWM servo driver</text>
  <text class="t pin" x="965" y="304">VCC  SDA  SCL  GND</text>
  <rect x="1220" y="285" width="245" height="60" rx="14" fill="#341b27" stroke="#ff5277" stroke-width="3"/>
  <text class="t m" x="1252" y="325" fill="#ffb1c2">V+ SERVO POWER</text>
  <text class="t xs" x="965" y="365" opacity=".72">CH 0–11 → 12 servo signal wires</text>

  <rect class="module" x="920" y="420" width="590" height="130" rx="24"/>
  <text class="t m" x="965" y="467">OLED SSD1306 · 128×64 · 0x3C</text>
  <text class="t pin" x="965" y="515">VCC  SDA  SCL  GND</text>

  <rect class="module" x="920" y="585" width="280" height="155" rx="24"/>
  <text class="t m" x="955" y="630">VL53L1X LEFT</text>
  <text class="t s" x="955" y="662">I²C 0x29</text>
  <text class="t pin" x="955" y="705">VIN SDA SCL GND</text>
  <text class="t xs" x="955" y="730">XSHUT ← GPIO26</text>

  <rect class="module" x="1230" y="585" width="280" height="155" rx="24"/>
  <text class="t m" x="1265" y="630">VL53L1X RIGHT</text>
  <text class="t s" x="1265" y="662">I²C 0x29</text>
  <text class="t pin" x="1265" y="705">VIN SDA SCL GND</text>
  <text class="t xs" x="1265" y="730">XSHUT ← GPIO27</text>

  <!-- shared buses -->
  <path class="line" stroke="#43dcff" d="M480 363H735V285H920M735 363V485H920M735 485V665H920M735 665H1230"/>
  <path class="line" stroke="#b68cff" d="M480 423H775V315H920M775 423V510H920M775 510V695H920M775 695H1230"/>
  <path class="line thin" stroke="#ffe16b" d="M480 503H700V770H1060V740"/>
  <path class="line thin" stroke="#ff9a54" d="M480 563H665V805H1370V740"/>
  <path class="line thin" stroke="#64efbd" d="M480 623H625V835H875V260H920M875 485H920M875 635H920M875 635H1230"/>
  <path class="line thin" stroke="#dce4f2" d="M480 673H590V870H840V340H920M840 525H920M840 720H920M840 720H1230" opacity=".85"/>

  <g class="t xs" font-weight="800">
    <rect x="540" y="330" width="142" height="38" rx="10" fill="#12364a"/><text x="558" y="356">SDA · GPIO21</text>
    <rect x="540" y="390" width="142" height="38" rx="10" fill="#30274b"/><text x="558" y="416">SCL · GPIO22</text>
  </g>

  <rect x="90" y="760" width="430" height="130" rx="24" fill="#341b27" stroke="#ff5277" stroke-width="3"/>
  <text class="t m" x="130" y="810">REGULATED SERVO SUPPLY</text>
  <text class="t s" x="130" y="844">+ → PCA9685 V+ only</text>
  <text class="t s" x="130" y="874">− → common GND</text>
  <path class="line" stroke="#ff5277" filter="url(#glow)" d="M520 800H560V140H1470V285"/>
  <path class="line thin" stroke="#dce4f2" d="M520 865H590"/>

  <rect x="920" y="790" width="590" height="100" rx="20" fill="#0c2431" stroke="#43dcff" stroke-width="2"/>
  <text class="t m" x="955" y="830">PCA CHANNEL MAP / MAPA KANAŁÓW</text>
  <text class="t s" x="955" y="865">0–2 front right · 3–5 rear right · 6–8 front left · 9–11 rear left</text>

  <rect x="70" y="930" width="1460" height="78" rx="20" fill="#2b1520" stroke="#ff5277" stroke-width="3"/>
  <text class="t m" x="800" y="965" text-anchor="middle">⚠ NEVER POWER SERVOS FROM ESP32 · COMMON GROUND REQUIRED</text>
  <text class="t s" x="800" y="994" text-anchor="middle" opacity=".82">Nie zasilaj serw z ESP32 · masa ESP32, PCA9685, czujników i zasilacza serw musi być wspólna</text>
</svg>
