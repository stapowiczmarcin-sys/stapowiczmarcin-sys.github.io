<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">KORA 5.5 — ESP32-C3 wiring</title><desc id="desc">TFT CS10 RST5 DC4 MOSI7 SCK6 MISO2; encoder A0 B1 SW9; back button8; shared GND; 3.3V logic. Battery module SM5308 is provisional.</desc><rect width="1200" height="750" fill="#101418"/><g font-family="Arial,Helvetica,sans-serif"><text x="42" y="48" fill="#d9ff57" font-size="27" text-anchor="start">KORA 5.5 / WIRING · POŁĄCZENIA</text><text x="42" y="80" fill="#a6b4ba" font-size="16" text-anchor="start">Logic diagram, not physical pin positions / Schemat logiczny, nie układ pinów</text><rect x="42" y="114" width="275" height="337" rx="12" fill="#1b252c" stroke="#53646e"/><text x="60" y="147" fill="#ffffff" font-size="20" text-anchor="start">TFT ILI9341 · SPI</text><rect x="505" y="114" width="246" height="399" rx="12" fill="#1b252c" stroke="#53646e"/><text x="523" y="147" fill="#ffffff" font-size="20" text-anchor="start">ESP32-C3 Super Mini</text><rect x="960" y="114" width="200" height="240" rx="12" fill="#1b252c" stroke="#53646e"/><text x="978" y="147" fill="#ffffff" font-size="20" text-anchor="start">ENCODER</text><rect x="960" y="388" width="200" height="117" rx="12" fill="#1b252c" stroke="#53646e"/><text x="978" y="421" fill="#ffffff" font-size="20" text-anchor="start">BACK / BAK</text><text x="62" y="181" fill="#e8eff1" font-size="18" text-anchor="start">CS</text><text x="525" y="181" fill="#e8eff1" font-size="18" text-anchor="start">GPIO10</text><path d="M 295 175 H 505" stroke="#79d8f3" stroke-width="3"/><text x="62" y="218" fill="#e8eff1" font-size="18" text-anchor="start">RESET</text><text x="525" y="218" fill="#e8eff1" font-size="18" text-anchor="start">GPIO5</text><path d="M 295 212 H 505" stroke="#ffd37b" stroke-width="3"/><text x="62" y="255" fill="#e8eff1" font-size="18" text-anchor="start">DC / RS</text><text x="525" y="255" fill="#e8eff1" font-size="18" text-anchor="start">GPIO4</text><path d="M 295 249 H 505" stroke="#d1a3fa" stroke-width="3"/><text x="62" y="292" fill="#e8eff1" font-size="18" text-anchor="start">SDI / MOSI</text><text x="525" y="292" fill="#e8eff1" font-size="18" text-anchor="start">GPIO7</text><path d="M 295 286 H 505" stroke="#90e9af" stroke-width="3"/><text x="62" y="329" fill="#e8eff1" font-size="18" text-anchor="start">SCK</text><text x="525" y="329" fill="#e8eff1" font-size="18" text-anchor="start">GPIO6</text><path d="M 295 323 H 505" stroke="#ffa494" stroke-width="3"/><text x="62" y="366" fill="#e8eff1" font-size="18" text-anchor="start">SDO / MISO*</text><text x="525" y="366" fill="#e8eff1" font-size="18" text-anchor="start">GPIO2</text><path d="M 295 360 H 505" stroke="#d2dc87" stroke-width="3"/><text x="62" y="409" fill="#a5b4bb" font-size="16" text-anchor="start">VCC + LED</text><text x="62" y="436" fill="#a5b4bb" font-size="16" text-anchor="start">GND</text><text x="525" y="439" fill="#ffcc82" font-size="15" text-anchor="start">3V3 → TFT VCC / LED</text><text x="525" y="473" fill="#a5b4bb" font-size="15" text-anchor="start">GND → shared / wspólna</text><text x="980" y="181" fill="#e8eff1" font-size="18" text-anchor="start">A / CLK</text><text x="733" y="181" fill="#00e5e5" font-size="17" text-anchor="end">GPIO0</text><path d="M 751 175 H 960" stroke="#00dddd" stroke-width="3"/><text x="980" y="230" fill="#e8eff1" font-size="18" text-anchor="start">B / DT</text><text x="733" y="230" fill="#00e5e5" font-size="17" text-anchor="end">GPIO1</text><path d="M 751 224 H 960" stroke="#00dddd" stroke-width="3"/><text x="980" y="279" fill="#e8eff1" font-size="18" text-anchor="start">SW / PSH</text><text x="733" y="279" fill="#00e5e5" font-size="17" text-anchor="end">GPIO9</text><path d="M 751 273 H 960" stroke="#00dddd" stroke-width="3"/><text x="980" y="331" fill="#a5b4bb" font-size="16" text-anchor="start">COM → GND</text><text x="980" y="447" fill="#e8eff1" font-size="18" text-anchor="start">GPIO8 ↔ GND</text><path d="M 751 467 H 890 V 440 H 960" fill="none" stroke="#d1a3fa" stroke-width="3"/><text x="733" y="497" fill="#d1a3fa" font-size="16" text-anchor="end">BAK / GPIO8</text><text x="42" y="492" fill="#a6b4ba" font-size="16" text-anchor="start">* MISO optional if no SDO. SD card / touch unused.</text><text x="42" y="518" fill="#a6b4ba" font-size="16" text-anchor="start">Release SW + BAK at reset / Puść SW i BAK przy starcie.</text><rect x="42" y="552" width="1118" height="155" rx="12" fill="#20222d" stroke="#a58adb" stroke-dasharray="7 5"/><text x="62" y="581" fill="#d9c9ff" font-size="17" text-anchor="start">BATTERY OPTION / WARIANT BATERYJNY — SM5308: exact module to confirm / do potwierdzenia</text><rect x="68" y="600" width="170" height="46" rx="7" fill="#111820" stroke="#687984"/><text x="153.0" y="629" fill="#e8eff1" font-size="17" text-anchor="middle">18650 · 1S</text><rect x="359" y="600" width="245" height="46" rx="7" fill="#111820" stroke="#687984"/><text x="481.5" y="629" fill="#e8eff1" font-size="17" text-anchor="middle">SM5308 USB-C / A</text><rect x="783" y="600" width="340" height="46" rx="7" fill="#111820" stroke="#687984"/><text x="953.0" y="629" fill="#e8eff1" font-size="17" text-anchor="middle">ESP32-C3 · USB power</text><path d="M 239 623 H 359 M 604 623 H 783" stroke="#b199dc" stroke-width="3" fill="none"/><text x="247" y="614" fill="#b8a3e0" font-size="12" text-anchor="start">BAT + / −</text><text x="624" y="614" fill="#b8a3e0" font-size="12" text-anchor="start">USB-A OUT 5V</text><text x="62" y="685" fill="#a6b4ba" font-size="15" text-anchor="start">Verify module markings and polarity. No direct cell → 3V3. / Sprawdź oznaczenia; ogniwo nie trafia na 3V3.</text><path d="M 295 403 H 400 V 433 H 505" fill="none" stroke="#ffcc82" stroke-width="3"/><path d="M 295 430 H 370 V 467 H 505" fill="none" stroke="#a5b4bb" stroke-width="3"/><text x="960" y="373" fill="#a6b4ba" font-size="13">VCC module → 3V3 if required</text></g></svg>