<text x="554" y="808" font-size="19" fill="#aebed0" font-weight="400">100 nF: between pins 14 and 7, next to the chip / między pinami 14 i 7, przy układzie.</text>
<text x="554" y="838" font-size="19" fill="#aebed0" font-weight="400">Power + GND: direct to strip; do not route LED current through ESP or Dupont wires.</text>
<text x="554" y="866" font-size="19" fill="#aebed0" font-weight="400">Zasilanie LED bezpośrednio do taśmy; nie przez ESP ani cienkie przewody Dupont.</text>
<text x="64" y="925" font-size="19" fill="#aebed0" font-weight="400">Dots mark connections. Crossing lines without dots are not connected. Pin mapping comes from the sketch.</text>
<text x="64" y="949" font-size="18" fill="#aebed0" font-weight="400">Kropka oznacza połączenie; skrzyżowanie bez kropki nie łączy przewodów. Sprawdź model płytki i napięcie taśmy.</text>
