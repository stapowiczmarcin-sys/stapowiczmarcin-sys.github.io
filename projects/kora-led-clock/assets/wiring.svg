<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc"><title id="title">KORA LED Clock — ESP8266 to 5 V LEDs / Połączenie ESP8266 z diodami 5 V</title><desc id="desc">Reference wiring for the supplied ESP8266 sketch: D2 GPIO4 to 74AHCT125 input pin 2, output pin 3 through 330–470 ohms to first LED DIN. 74AHCT125 pin 14 to external regulated 5 V, pins 1 and 7 to common ground. ESP powered by USB, LEDs by separate 5 V supply. 100 nF across chip supply and 500–1000 microfarad across LED supply. No LED power through ESP board.</desc><rect width="1600" height="960" rx="28" fill="#0a111b"/><g font-family="Arial,Helvetica,sans-serif">
